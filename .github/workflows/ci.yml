name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 24 tests: special functions vs. table values, estimator recovery on
      # synthetic data, and the shipped catalog vs. published benchmarks.
      - run: node --test test/engine.test.mjs
